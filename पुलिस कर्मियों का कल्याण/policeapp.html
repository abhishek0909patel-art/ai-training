<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पुलिस कर्मियों का कल्याण</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #003366;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #003366;
        }

        .btn {
            background: #0066cc;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #004c99;
        }

        footer {
            text-align: center;
            background: #003366;
            color: white;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        🚔 पुलिस कर्मियों का कल्याण
    </header>

    <div class="container">

        <div class="card">
            <h2>कर्मचारी प्रोफाइल</h2>
            <p>नाम: पुलिस कर्मचारी</p>
            <p>पद: कांस्टेबल</p>
            <p>आईडी: 12345</p>
        </div>

        <div class="card">
            <h2>स्वास्थ्य सुविधाएं</h2>
            <p>स्वास्थ्य जांच, अस्पताल जानकारी और चिकित्सा सहायता।</p>
            <button class="btn">विवरण देखें</button>
        </div>

        <div class="card">
            <h2>वित्तीय सहायता</h2>
            <p>कल्याण निधि, बीमा और आर्थिक सहायता योजनाएं।</p>
            <button class="btn">जानकारी प्राप्त करें</button>
        </div>

        <div class="card">
            <h2>शिकायत एवं सुझाव</h2>
            <textarea rows="5" style="width:100%;"></textarea>
            <br><br>
            <button class="btn">सबमिट करें</button>
        </div>

    </div>

    <footer>
        © 2026 पुलिस कर्मियों का कल्याण पोर्टल
    </footer>

</body>

</html>
